name: Linux release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libnss3 libasound2t64 libgtk-3-0t64 libgbm1 libfuse2t64 fontconfig fonts-noto-cjk
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Test desktop, editing and code runtimes
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/run-regressions.mjs all tests/desktop-platform.spec.ts tests/format-toggle.spec.ts tests/folding-quotes.spec.ts
        env:
          MOYU_TEST_XVFB: '1'
      - name: Build AppImage and DEB
        run: node scripts/dist.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Calculate checksums
        run: |
          version=$(node -p "require('./package.json').version")
          cd "release/v$version"
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moyu-linux-x64
          if-no-files-found: error
          path: |
            release/v*/*.AppImage
            release/v*/*.deb
            release/v*/SHA256SUMS-linux.txt
