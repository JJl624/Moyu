name: Desktop release
on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: '同时测试并构建 Linux'
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package versions differ' }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/dist-win.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hash portable executable
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "release/v$version/Moyu-$version-x64.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $exe)" | Set-Content -Encoding utf8NoBOM "release/v$version/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Moyu-windows-x64
          if-no-files-found: error
          path: |
            release/v*/*.exe
            release/v*/SHA256SUMS.txt
      - name: Create release draft
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { Write-Host 'Published release retained'; exit 0 }
            if ($release.assets.Count -gt 0) { Write-Host 'Existing release assets retained'; exit 0 }
          } else {
            gh release create $tag --verify-tag --draft --title "Moyu $version" --notes "Windows x64 便携版。"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag "release/v$version/Moyu-$version-x64.exe" "release/v$version/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libnss3 libasound2t64 libgtk-3-0t64 libgbm1 libfuse2t64 fontconfig fonts-noto-cjk
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Test native desktop, runtimes and editing
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/run-regressions.mjs all tests/desktop-platform.spec.ts tests/format-toggle.spec.ts tests/folding-quotes.spec.ts
        env:
          MOYU_TEST_XVFB: '1'
      - run: node scripts/dist.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hash Linux packages
        run: |
          version=$(node -p "require('./package.json').version")
          cd "release/v$version"
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moyu-linux-x64
          if-no-files-found: error
          path: |
            release/v*/*.AppImage
            release/v*/*.deb
            release/v*/SHA256SUMS-linux.txt
      - name: Attach Linux packages to release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Published release retained'
            exit 0
          fi
          gh release upload "$tag" release/v"$version"/*.AppImage release/v"$version"/*.deb release/v"$version"/SHA256SUMS-linux.txt --clobber
