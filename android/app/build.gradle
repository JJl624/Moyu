plugins { id 'com.android.application' }
def mobileBuild = new groovy.json.JsonSlurper().parse(rootProject.file('../shared/mobile-build.json'))
def signingFile = rootProject.file('signing/moyu-release.properties')
def signingValues = new Properties()
if(signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
android {
    namespace 'app.moyu.notes'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'app.moyu.notes'
        minSdk 29
        targetSdk 36
        versionCode mobileBuild.versionCode
        versionName mobileBuild.version
        resValue 'string', 'app_name', '墨屿'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if(signingFile.exists()) {
                storeFile rootProject.file('signing/moyu-release.jks')
                storePassword signingValues.getProperty('storePassword')
                keyAlias 'moyu'
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            resValue 'string', 'app_name', '墨屿 Dev'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
