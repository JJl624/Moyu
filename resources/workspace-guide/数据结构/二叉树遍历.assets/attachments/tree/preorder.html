<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二叉树 · 前序遍历</title><link rel="stylesheet" href="tree.css"></head>
<body data-order="pre"><main>
  <div class="heading"><span class="rule"></span><span id="progress"></span></div>
  <svg class="scene" viewBox="0 0 304 145" role="img" aria-label="二叉树遍历"></svg>
  <div class="trace"><span id="frontier-label"></span><span id="frontier"></span></div>
  <div class="result"><span>访问序列</span><div id="output" aria-live="polite"></div></div>
  <p id="explanation" aria-live="polite"></p>
  <div class="program" aria-label="遍历步骤"></div>
  <div class="controls"><button id="previous">上一步</button><button id="play">播放</button><button id="next">下一步</button><button id="reset" aria-label="重置" title="重置">↺</button></div>
</main><script src="tree.js"></script></body></html>
